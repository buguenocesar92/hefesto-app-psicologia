# =============================================================================
# nginx al frente de PHP-FPM
# =============================================================================
# Un solo servidor, escuchando en el 8000. El proxy de adentro (Caddy) es el
# único que publica puertos hacia afuera.
#
# LO QUE ESTE ARCHIVO PROTEGE
# ---------------------------
#   - Que los errores de PHP no lleguen al navegador. En una aplicación con
#     notas de sesión, una excepción en pantalla puede incluir contenido de una
#     petición.
#   - Que no se listen los archivos. Un directorio abierto en `/storage`
#     significaría un respaldo descargable.
#   - Que solo se acepten los métodos que existen.
# =============================================================================

user www-data;
worker_processes auto;

error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # El nombre de servidor no se muestra: no sirve de nada y devela que hay
    # un nginx detrás.
    server_tokens off;

    # =============================================================================
    # Límites
    # =============================================================================
    client_max_body_size 8m;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # =============================================================================
    # Tiempos
    # =============================================================================
    fastcgi_read_timeout 120s;
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # =============================================================================
    # Servidor de la aplicación
    # =============================================================================
    server {
        listen 8000;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # ---------------------------------------------------------------------
        # Lo que nunca se sirve
        # ---------------------------------------------------------------------
        # El esqueleto de la aplicación, los respaldos y los registros no se
        # sirven por ninguna URL.
        location ~ /\. {
            deny all;
        }

        location ~ ^/(storage|bootstrap|app|config|database|routes|tests|vendor)/ {
            deny all;
        }

        location ~ \.(sql|dump|tar|gz|zip|bak|log|env|key)$ {
            deny all;
        }

        # ---------------------------------------------------------------------
        # Un solo índice
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ---------------------------------------------------------------------
        # PHP
        # ---------------------------------------------------------------------
        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            include fastcgi_params;

            # Los argumentos de la ruta y de la consulta se pasan por
            #parameters, no por la cadena de consulta de la URL: la URL de una
            # respuesta de error a veces queda en un registro del proxy.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # =============================================================================
            # LO QUE HACE ESTE ARCHIVO SEGURO
            # =============================================================================
            # En un sistema de historia clínica, una excepción en pantalla puede
            # incluir contenido de una petición. Si eso llega al navegador, ya no
            # es un error de programación: es una entrega de datos.
            fastcgi_hide_header X-Powered-By;

            # Cabeceras de seguridad.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Cache-Control "no-store" always;

            # =============================================================================
            # LA COOKIE DE SESIÓN
            # =============================================================================
            # httpOnly: la cookie no se puede leer desde JavaScript. secure en
            # producción. SameSite Lax: el robo de cookie deja de servir desde
            # otro sitio.
            fastcgi_param PHP_VALUE "session.cookie_httponly=1";
            fastcgi_param PHP_VALUE "session.cookie_samesite=Lax";
            fastcgi_param PHP_VALUE "expose_php=0";
        }

        # ---------------------------------------------------------------------
        # Archivos estáticos
        # ---------------------------------------------------------------------
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # Comprobación de vida
        # ---------------------------------------------------------------------
        # Esta ruta la declara Laravel en `bootstrap/app.php` como `health`. No
        # toca la base: para eso está el orquestador de contenedores.
        location = /api/v1/salud {
            try_files $uri /index.php$is_args$args;
        }
    }
}