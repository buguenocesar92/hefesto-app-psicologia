; =============================================================================
; Configuración de PHP de Psicología
; =============================================================================

; Registro: los errores no se muestran al navegador. En una aplicación con notas
; de sesión, una excepción en pantalla puede incluir contenido de una petición.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Registro PHP duplicado por el de Laravel: se deja el de PHP apuntando a
; stderr para no perder los avisos del motor.
memory_limit = 256M
max_execution_time = 30

; Un consultorio de psicología no sube archivos por la interfaz: el límite es
; bajo a propósito. No hay consentimientos firmados en PDF ni documentos
; clínicos adjuntos en esta versión, y no se abre la puerta a que se empiecen a
; subir sin que nadie lo decida. Ver docs/06.
file_uploads = Off
upload_max_filesize = 4M
post_max_size = 4M

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; `validate_timestamps = 0` obliga a reiniciar el contenedor en cada despliegue.
; Es lo correcto en producción; el compose de desarrollo lo sobrescribe con
; este último comentario.
opcache.validate_timestamps = 0

date.timezone = UTC

session.cookie_httponly = 1
; La cookie de sesión no viaja por JavaScript: con CSRF aparte, el robo de
; cookie deja de ser utilizable desde el navegador.
session.cookie_samesite = "Lax"