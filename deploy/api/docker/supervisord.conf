; =============================================================================
; Procesos del contenedor de la API
; =============================================================================
;
; TRES PROCESOS, NO UNO
; ---------------------
;   - `php-fpm`: atiende las peticiones HTTP.
;   - `cola`:    la consolidación de la bitácora.
;   - `planificador`: dispara la tarea diaria.
;
; POR QUÉ SEPARADOS Y EN EL MISMO CONTENEDOR
; ------------------------------------------
; La cola cuenta sobre `accesos`, que es la tabla que más crece. Si se quedara
; sin trabajador, el profesional sigue atendiendo; si se quedara sin web, deja
; de poder entrar. Son fallos distintos y con distinta consecuencia, así que
; conviene verlos por separado en los registros.
;
; El límite de memoria de la cola es más bajo a propósito: si una tarea se
; queda consumiendo, no puede llevarse por delante la web.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.d/www.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cola]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=192
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:planificador]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -----------------------------------------------------------------------------
; El planificador corre `schedule:work`, que sí consume las tareas periodicadas
; que declara `AppServiceProvider`.
;
; En esta aplicación hay una sola: la consolidación diaria de la bitácora de
; accesos, a las 02:30.
;
; NO HAY NINGUNA TAREA QUE BORRE HISTORIA CLÍNICA. Los plazos de conservación
; están en `null` por omisión, y sin plazo configurado no hay purga. Ver docs/06.
; -----------------------------------------------------------------------------

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface