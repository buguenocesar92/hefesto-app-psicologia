# =============================================================================
# Psicología: producción
# =============================================================================
#
# LO QUE CAMBIA RESPECTO DEL DESARROLLO, Y POR QUÉ
# --------------------------------------------------
#
# 1. NINGÚN PUERTO PUBLICADO, salvo el del proxy.
#    Ni 5432, ni 6379, ni 8000, ni 3000. Con eso, la base de datos no está en
#    la red pública aunque alguien descubra la instalación. Ver docs/04.
#
# 2. REDES SEPARADAS.
#    `datos` no tiene salida a internet: la base y Redis no tienen por qué
#    hablar con el mundo. Solo el proxy sale.
#
# 3. SIN MONTAJES DE CÓDIGO.
#    El código va en la imagen. Montar el repositorio encima dejaría que un
#    cambio de una línea en el servidor cambiara lo que se ejecuta sin que
#    nadie rebuildée.
#
# 4. LÍMITES DE RECURSOS Y REINICIOS.
#    Un contenedor sin límites puede llevarse por delante a los demás.
#
# 5. `APP_DEBUG` EN FALSO Y `SESSION_SECURE_COOKIE` EN VERDAD.
#    Con las dos al revés, una excepción muestra contenido de una petición en
#    el navegador y la cookie de sesión viaja en claro.
# =============================================================================

name: psicologia

services:

    # -------------------------------------------------------------------------
    # PostgreSQL.
    #
    # DOS ROLES, Y NO UNO
    # -------------------
    # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
    # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
    # se usa para crear la base y para las tareas administrativas. La
    # aplicacion NUNCA conecta con el.
    #
    # El rol de la aplicacion (`DB_USERNAME`) lo crea
    # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
    # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
    # para que las migraciones de Laravel puedan crear el esquema.
    #
    # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
    # superusuarios "always bypass the row security system", y que
    # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
    # superusuario. Con un solo rol las politicas no se aplicarian y el
    # aislamiento entre empresas seria decorativo. Ver docs/03.
    # -------------------------------------------------------------------------
    base:
        image: postgres:18.6-alpine
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_ADMIN_USERNAME:-psicologia_admin}
            POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env.prod}
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
            # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
            APP_DB_ROLE: ${DB_USERNAME:-psicologia}
            APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
        volumes:
            - datos_base:/var/lib/postgresql/data
            - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-psicologia} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        # SIN PUERTOS. Ver la nota de arriba.
        networks:
            - datos
        deploy:
            resources:
                limits:
                    memory: 2G
                    cpus: "2.0"
                reservations:
                    memory: 512M

    redis:
        image: redis:8.8.3-alpine
        restart: always
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD}
            --save 900 1
            --appendonly no
            --maxmemory 512mb
            --maxmemory-policy allkeys-lru
        volumes:
            - datos_redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - datos

    api:
        image: ${REGISTRO_API:-psicologia-api}:${VERSION:-1.0.0}
        build:
            context: ../api
            dockerfile: ../deploy/api/Dockerfile
        restart: always
        depends_on:
            base:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - ../api/.env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_SESSION_SECURE_COOKIE: "true"
            DB_HOST: base
            REDIS_HOST: redis
        # SIN PUERTOS. La API se habla por la red interna.
        networks:
            - datos
            - aplicacion
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: "2.0"
                reservations:
                    memory: 256M

    interfaz:
        image: ${REGISTRO_WEB:-psicologia-web}:${VERSION:-1.0.0}
        build:
            context: ../../web
            dockerfile: ../deploy/web/Dockerfile
        restart: always
        depends_on:
            - api
        environment:
            NUXT_API_BASE: http://api:8000
            NITRO_PORT: "3000"
        # SIN PUERTOS.
        networks:
            - aplicacion
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"
                reservations:
                    memory: 128M

    proxy:
        image: caddy:2.11.7-alpine
        restart: always
        depends_on:
            - interfaz
        environment:
            PSICOLOGIA_DOMINIO: ${PSICOLOGIA_DOMINIO}
            ACME_CORREO: ${ACME_CORREO}
        ports:
            # EL ÚNICO PUERTO PUBLICADO DE TODA LA INSTALACIÓN.
            - "80:80"
            - "443:443"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - datos_caddy:/data
        networks:
            - aplicacion

volumes:
    datos_base:
    datos_redis:
    datos_caddy:

networks:
    # Sin salida a internet. La base de datos no habla con el mundo.
    datos:
        internal: true
    aplicacion: