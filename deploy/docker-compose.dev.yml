# =============================================================================
# Psicología: desarrollo
# =============================================================================
# Copie `../api/.env.example` a `../api/.env` y complete los valores antes de
# levantar esto.
#
# EN DESARROLLO SÍ SE PUBLICAN PUERTOS
# ------------------------------------
# El 8000 es la API, el 3000 la interfaz, el 8080 el proxy, el 5432 la base y
# el 6379 Redis. Publicarlos es cómodo para desarrollo.
#
# En producción no se publica ninguno: solo el proxy. Ver
# `docker-compose.prod.yml`. Ver docs/04.
# =============================================================================

name: psicologia

services:

    # -------------------------------------------------------------------------
    # PostgreSQL.
    #
    # DOS ROLES, Y NO UNO
    # -------------------
    # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
    # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
    # se usa para crear la base y para las tareas administrativas. La
    # aplicacion NUNCA conecta con el.
    #
    # El rol de la aplicacion (`DB_USERNAME`) lo crea
    # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
    # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
    # para que las migraciones de Laravel puedan crear el esquema.
    #
    # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
    # superusuarios "always bypass the row security system", y que
    # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
    # superusuario. Con un solo rol las politicas no se aplicarian y el
    # aislamiento entre empresas seria decorativo. Ver docs/03.
    # -------------------------------------------------------------------------
    base:
        image: postgres:18.6-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-psicologia}
            POSTGRES_USER: ${DB_ADMIN_USERNAME:-psicologia_admin}
            POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
            # El idioma de la base decide el orden de las reglas de
            # PostgreSQL. Fijarlo evita que una instalación ordena distinto
            # según dónde se creó.
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
            # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
            APP_DB_ROLE: ${DB_USERNAME:-psicologia}
            APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
        ports:
            - "5432:5432"
        volumes:
            - datos_base:/var/lib/postgresql/data
            - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-psicologia} -d ${DB_DATABASE:-psicologia}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - interna

    redis:
        image: redis:8.8.3-alpine
        restart: unless-stopped
        command: >
            redis-server
            --save 900 1
            --appendonly no
            --maxmemory 256mb
            --maxmemory-policy allkeys-lru
        ports:
            - "6379:6379"
        volumes:
            - datos_redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - interna

    api:
        build:
            context: ../api
            dockerfile: ../deploy/api/Dockerfile
        restart: unless-stopped
        depends_on:
            base:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - ../api/.env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_SESSION_SECURE_COOKIE: "false"
            DB_HOST: base
            REDIS_HOST: redis
            # El orquestador no espera al orquestador: la API espera a la base.
            PSICOLOGIA_NO_ESPERAR_API: "1"
        ports:
            - "8000:8000"
        volumes:
            - ../api:/var/www/html:delegated
        networks:
            - interna
            - publica

    interfaz:
        build:
            context: ../../web
            dockerfile: ../deploy/web/Dockerfile
        restart: unless-stopped
        depends_on:
            - api
        environment:
            NUXT_API_BASE: http://api:8000
            NITRO_PORT: "3000"
        ports:
            - "3000:3000"
        networks:
            - interna
            - publica

    proxy:
        image: caddy:2.11.7-alpine
        restart: unless-stopped
        depends_on:
            - interfaz
        environment:
            PSICOLOGIA_DOMINIO: ${PSICOLOGIA_DOMINIO:-localhost:8080}
            ACME_CORREO: ${ACME_CORREO:-admin@ejemplo.cl}
        ports:
            - "8080:80"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - datos_caddy:/data
        networks:
            - publica

volumes:
    datos_base:
    datos_redis:
    datos_caddy:

networks:
    # `interna` no tiene salida a la red externa. La base y Redis no tienen por
    # qué hablar con el mundo.
    interna:
        internal: true
    publica: